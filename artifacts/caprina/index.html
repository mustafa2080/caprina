<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function(){
        var t = localStorage.getItem('caprina-theme') || 'dark';
        document.documentElement.classList.add(t);
      })();
    </script>

    <!-- Viewport + PWA display -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- iOS Safari PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CAPRINA" />
    <link rel="apple-touch-icon" href="./logo.jpg" />
    <link rel="apple-touch-icon" sizes="152x152" href="./logo.jpg" />
    <link rel="apple-touch-icon" sizes="167x167" href="./logo.jpg" />
    <link rel="apple-touch-icon" sizes="180x180" href="./logo.jpg" />

    <!-- Android + Chrome PWA theme -->
    <meta name="theme-color" content="#c9971c" />
    <link rel="manifest" href="./manifest.json" />

    <!-- Windows -->
    <meta name="msapplication-TileColor" content="#0a0a0a" />
    <meta name="msapplication-TileImage" content="./logo.jpg" />

    <!-- SEO -->
    <meta name="description" content="نظام CAPRINA لإدارة الطلبات والمبيعات — تحكم كامل في دورة حياة طلباتك" />

    <!-- Icons -->
    <link rel="icon" type="image/jpeg" href="./favicon.jpg" />
    <link rel="shortcut icon" href="./favicon.jpg" />

    <title>CAPRINA OS — إدارة الطلبات</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!-- Video Background — shown only on login page, hidden after login via JS -->
    <video
      id="login-bg-video"
      autoplay
      loop
      muted
      playsinline
      webkit-playsinline
      style="position:fixed;top:0;left:0;width:100vw;height:100vh;object-fit:cover;z-index:0;display:none;"
    >
      <source src="./video/background.mp4" type="video/mp4" />
    </video>
    <script>
      // أظهر الفيديو بس لما نكون على صفحة اللوجين
      (function(){
        function isLoginPath(){
          var p = window.location.pathname;
          // يطابق /login أو / أو أي base path ينتهي بـ /login أو /
          return p === '/login' || p === '/' || p.endsWith('/login');
        }
        function checkRoute(){
          var v = document.getElementById('login-bg-video');
          var html = document.documentElement;
          if(!v) return;
          var show = isLoginPath();
          if(show){
            v.style.display = 'block';
            html.classList.add('login-active');
            // تأكد إن الفيديو شغال
            if(v.paused){
              v.play().catch(function(){});
            }
          } else {
            v.style.display = 'none';
            html.classList.remove('login-active');
            v.pause();
          }
        }
        // شغل فوراً
        checkRoute();
        // راقب تغيير الـ route
        var _pushState = history.pushState;
        history.pushState = function(){
          _pushState.apply(history, arguments);
          setTimeout(checkRoute, 50);
        };
        var _replaceState = history.replaceState;
        history.replaceState = function(){
          _replaceState.apply(history, arguments);
          setTimeout(checkRoute, 50);
        };
        window.addEventListener('popstate', checkRoute);
        // fallback: اتأكد كمان بعد ما React يشتغل
        window.addEventListener('load', function(){ setTimeout(checkRoute, 200); });
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
